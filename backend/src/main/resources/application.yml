server:
  port: ${PORT:${SERVER_PORT:8080}}

spring:
  application:
    name: typingiq-backend

  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/typingiq_db}

# Security & JWT Configuration (Configurable via environment variables)
app:
  jwt:
    secret: ${APP_JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:86400000} # 24 hours

# Python FastAPI Internal ML Service Gateway
typingiq:
  ml-service:
    base-url: ${TYPINGIQ_ML_SERVICE_URL:http://127.0.0.1:8000/internal/v1/ml}
